name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Type check
        run: make typecheck

      - name: Unit tests
        run: make test

      - name: Build app bundle
        run: make build
