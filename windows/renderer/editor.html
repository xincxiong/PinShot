<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: blob: data:; font-src 'self'; connect-src 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinShot 标注</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body data-page="editor">
    <div class="workbench" id="workbench">
      <div class="toolbar" id="toolbar">
        <div class="group tools" id="toolGroup">
          <button class="tool" data-tool="pen" title="画笔 (P)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
            </svg>
          </button>
          <button class="tool" data-tool="line" title="直线 (L)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="19" x2="19" y2="5" /></svg>
          </button>
          <button class="tool" data-tool="arrow" title="箭头 (A)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <line x1="5" y1="19" x2="19" y2="5" />
              <polyline points="13 5 19 5 19 11" />
            </svg>
          </button>
          <button class="tool" data-tool="rectangle" title="矩形 (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5" /></svg>
          </button>
          <button class="tool" data-tool="highlighter" title="高亮 (H)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 11-6 6v3h9l3-3" />
              <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" />
            </svg>
          </button>
          <button class="tool" data-tool="eraser" title="橡皮擦 (E)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" />
              <path d="M22 21H7" />
              <path d="m5 11 9 9" />
            </svg>
          </button>
        </div>

        <span class="sep"></span>

        <div class="group colors" id="colorGroup">
          <button class="swatch" data-color="#FF453A" style="--swatch: #ff453a" title="红色"></button>
          <button class="swatch" data-color="#FF9F0A" style="--swatch: #ff9f0a" title="橙色"></button>
          <button class="swatch" data-color="#FFD60A" style="--swatch: #ffd60a" title="黄色"></button>
          <button class="swatch" data-color="#32D74B" style="--swatch: #32d74b" title="绿色"></button>
          <button class="swatch" data-color="#0A84FF" style="--swatch: #0a84ff" title="蓝色"></button>
          <button class="swatch" data-color="#FFFFFF" style="--swatch: #ffffff" title="白色"></button>
        </div>

        <span class="sep"></span>

        <div class="group widths" id="widthGroup">
          <button class="width" data-width="2" title="细线 2">
            <span class="dot" style="--dot-size: 4px"></span>
          </button>
          <button class="width" data-width="4" title="中等 4">
            <span class="dot" style="--dot-size: 7px"></span>
          </button>
          <button class="width" data-width="8" title="粗线 8">
            <span class="dot" style="--dot-size: 11px"></span>
          </button>
        </div>

        <span class="sep"></span>

        <div class="group history">
          <button class="icon-btn" id="undoBtn" title="撤销 Ctrl+Z" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7v6h6" />
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
            </svg>
          </button>
          <button class="icon-btn" id="redoBtn" title="重做 Ctrl+Shift+Z" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 7v6h-6" />
              <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13" />
            </svg>
          </button>
        </div>

        <div class="spacer"></div>

        <div class="actions">
          <button class="text-btn" id="cancelBtn">取消</button>
          <button class="ghost-btn" id="saveBtn">保存</button>
          <button class="ghost-btn" id="copyBtn">复制</button>
          <button class="primary-btn" id="finishBtn">完成</button>
        </div>
      </div>

      <div class="canvas-area">
        <div class="canvas-shell" id="canvasShell">
          <canvas id="canvas"></canvas>
          <div class="eraser-cursor" id="eraserCursor" hidden></div>
        </div>
      </div>

      <div class="hint">
        拖拽绘制 · P 画笔 · L 直线 · A 箭头 · R 矩形 · H 高亮 · E 橡皮擦 · Ctrl+Z 撤销 · Enter 完成
      </div>

      <div class="busy" id="busy" hidden><span class="spinner"></span>正在导出…</div>
    </div>

    <script src="editor.js"></script>
  </body>
</html>
