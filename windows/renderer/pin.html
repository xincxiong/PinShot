<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: blob: data:; font-src 'self'; connect-src 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinShot 贴图</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="pin.css" />
  </head>
  <body data-page="pin">
    <div class="pin-window show-border show-shadow" id="pinWindow">
      <div class="card" id="card">
        <img class="pin-image" id="pinImage" alt="贴图" draggable="false" />

        <div class="toolbar" id="toolbar">
          <button class="tb" id="copyBtn" title="复制图片 (Ctrl+C)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="12" height="12" rx="2" />
              <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
            </svg>
          </button>
          <button class="tb" id="saveBtn" title="存储为… (Ctrl+S)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12" />
              <path d="m7 10 5 5 5-5" />
              <path d="M4 19v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1" />
            </svg>
          </button>
          <button class="tb active" id="autoHideBtn" title="自动隐藏：开（点击关闭）">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
          <button class="tb" id="placementBtn" title="浮于顶层（点击挂到桌面）">
            <svg class="icon-pin" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 17v5" />
              <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
            </svg>
            <svg class="icon-desktop" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="4" width="20" height="13" rx="2" />
              <path d="M8 21h8" />
              <path d="M12 17v4" />
            </svg>
          </button>
          <button class="tb" id="closeBtn" title="关闭 (Esc)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <line x1="6" y1="6" x2="18" y2="18" />
              <line x1="18" y1="6" x2="6" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <div class="handle tl" data-corner="top-left" title="拖动等比缩放"></div>
      <div class="handle tr" data-corner="top-right" title="拖动等比缩放"></div>
      <div class="handle bl" data-corner="bottom-left" title="拖动等比缩放"></div>
      <div class="handle br" data-corner="bottom-right" title="拖动等比缩放"></div>

      <div class="size-badge" id="sizeBadge" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <script src="pin.js"></script>
  </body>
</html>
